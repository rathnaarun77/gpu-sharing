grafana:
  adminPassword: admin
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: gpu
          folder: GPU
          type: file
          options: {path: /var/lib/grafana/dashboards/gpu}
  dashboards:
    gpu:
      dcgm-exporter:
        gnetId: 12239      # NVIDIA DCGM Exporter Dashboard
        revision: 2
        datasource: Prometheus
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    # label-agnostic scrape of the fake DCGM exporter (port 9400)
    additionalScrapeConfigs:
      - job_name: fake-dcgm
        kubernetes_sd_configs:
          - role: endpoints
            namespaces: {names: [gpu-operator]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoint_port_number]
            regex: "9400"
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node
alertmanager:
  enabled: false
